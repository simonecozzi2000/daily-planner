<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Progetti — Daily Planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  :root {
    --bg:#f2f2f7;--surf:#ffffff;--surf2:#f2f2f7;--brd:#e0e0e5;--brdl:#ebebef;
    --blue:#007aff;--blues:rgba(0,122,255,0.10);
    --red:#ff3b30;--reds:rgba(255,59,48,0.10);
    --green:#34c759;--greens:rgba(52,199,89,0.10);
    --orange:#ff9500;--oranges:rgba(255,149,0,0.10);
    --purple:#af52de;--purples:rgba(175,82,222,0.10);
    --tx:#1c1c1e;--tx2:#636366;--tx3:#aeaeb2;
    --sh1:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
    --sh2:0 4px 12px rgba(0,0,0,0.08),0 2px 4px rgba(0,0,0,0.04);
    --r:12px;--rsm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--tx);font-family:'Inter',-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;}

  /* TOPBAR */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--brdl);position:sticky;top:0;z-index:10;}
  .logo{font-size:0.95rem;font-weight:700;letter-spacing:-0.02em;color:var(--tx);text-decoration:none;}
  .logo span{color:var(--blue);}
  .nav-links{display:flex;gap:8px;}
  .nav-link{font-size:0.75rem;font-weight:600;padding:5px 12px;border-radius:99px;border:1.5px solid var(--brd);background:transparent;color:var(--tx2);cursor:pointer;text-decoration:none;transition:all 0.15s;font-family:inherit;}
  .nav-link:hover{background:var(--surf2);}
  .nav-link.active{background:var(--blue);color:#fff;border-color:var(--blue);}

  /* LOADING */
  .loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:12px;color:var(--tx2);}
  .load-spin{width:22px;height:22px;border:2px solid var(--brd);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* MAIN */
  .main{max-width:900px;margin:0 auto;padding:24px 20px;}

  /* ADD PROJECT */
  .add-project-bar{background:var(--surf);border-radius:var(--r);padding:16px;margin-bottom:20px;box-shadow:var(--sh1);}
  .add-project-title{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--tx3);margin-bottom:10px;}
  .add-project-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .add-input{flex:1;min-width:180px;background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--rsm);color:var(--tx);font-family:inherit;font-size:0.85rem;padding:8px 11px;outline:none;transition:border-color 0.2s;}
  .add-input:focus{border-color:var(--blue);}
  .add-input::placeholder{color:var(--tx3);}
  .add-date-col{display:flex;flex-direction:column;gap:2px;}
  .add-date-lbl{font-size:0.58rem;font-weight:600;color:var(--tx3);letter-spacing:0.06em;text-transform:uppercase;}
  .add-date{background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--rsm);color:var(--tx);font-family:inherit;font-size:0.78rem;padding:8px 10px;outline:none;transition:border-color 0.2s;}
  .add-date:focus{border-color:var(--blue);}
  .add-date::-webkit-calendar-picker-indicator{opacity:0.35;cursor:pointer;}
  .add-btn{background:var(--blue);color:#fff;border:none;cursor:pointer;padding:8px 18px;border-radius:var(--rsm);font-family:inherit;font-weight:600;font-size:0.82rem;transition:opacity 0.15s;white-space:nowrap;}
  .add-btn:hover{opacity:0.85;}

  /* PROJECTS LIST */
  .projects-list{display:flex;flex-direction:column;gap:12px;}

  /* PROJECT CARD */
  .project-card{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh1);overflow:hidden;transition:box-shadow 0.15s;}
  .project-card.dragging{opacity:0.5;box-shadow:var(--sh2);}
  .project-card.drag-over{box-shadow:0 0 0 2px var(--blue);}

  .project-header{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;}
  .drag-handle{color:var(--tx3);cursor:grab;font-size:1rem;flex-shrink:0;padding:2px 4px;}
  .drag-handle:active{cursor:grabbing;}
  .project-toggle{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:transparent;transition:all 0.15s;flex-shrink:0;cursor:pointer;}
  .project-card.completed .project-toggle{background:var(--green);border-color:var(--green);color:#fff;}
  .project-info{flex:1;min-width:0;}
  .project-name{font-size:0.92rem;font-weight:600;color:var(--tx);}
  .project-card.completed .project-name{text-decoration:line-through;color:var(--tx3);}
  .project-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap;}
  .project-deadline{font-size:0.65rem;font-weight:600;padding:2px 8px;border-radius:99px;}
  .scad-ok{background:var(--blues);color:var(--blue);}
  .scad-soon{background:var(--oranges);color:var(--orange);}
  .scad-today{background:var(--reds);color:var(--red);}
  .scad-late{background:var(--reds);color:var(--red);}
  .progress-wrap{display:flex;align-items:center;gap:6px;}
  .progress-bar{width:60px;height:4px;background:var(--brd);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width 0.3s;}
  .progress-text{font-size:0.62rem;color:var(--tx3);}
  .project-actions{display:flex;gap:4px;flex-shrink:0;}
  .proj-btn{width:26px;height:26px;border-radius:6px;border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:0.8rem;display:flex;align-items:center;justify-content:center;transition:all 0.15s;opacity:0;}
  .project-header:hover .proj-btn{opacity:1;}
  .proj-btn:hover{background:var(--reds);color:var(--red);}
  .proj-btn.edit-proj:hover{background:var(--blues);color:var(--blue);}
  .expand-btn{width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:0.75rem;display:flex;align-items:center;justify-content:center;transition:transform 0.2s;flex-shrink:0;}
  .project-card.expanded .expand-btn{transform:rotate(90deg);}

  /* SUBTASKS */
  .subtasks-area{border-top:1px solid var(--brdl);padding:10px 14px 12px;}
  .subtask-add-row{display:flex;gap:6px;margin-bottom:8px;}
  .subtask-input{flex:1;background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--rsm);color:var(--tx);font-family:inherit;font-size:0.8rem;padding:6px 10px;outline:none;transition:border-color 0.2s;}
  .subtask-input:focus{border-color:var(--blue);}
  .subtask-input::placeholder{color:var(--tx3);}
  .subtask-add-btn{background:var(--blue);color:#fff;border:none;cursor:pointer;width:28px;height:28px;border-radius:6px;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity 0.15s;}
  .subtask-add-btn:hover{opacity:0.85;}

  /* SUBTASK ITEM */
  .subtask-item{display:flex;align-items:flex-start;gap:7px;padding:5px 4px;border-radius:6px;transition:background 0.15s;position:relative;}
  .subtask-item:hover{background:var(--surf2);}
  .subtask-chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:0.55rem;color:transparent;transition:all 0.15s;flex-shrink:0;margin-top:2px;cursor:pointer;}
  .subtask-item.wip .subtask-chk{background:var(--blue);border-color:var(--blue);color:#fff;font-size:0.5rem;}
  .subtask-item.done .subtask-chk{background:var(--green);border-color:var(--green);color:#fff;}
  .subtask-body{flex:1;min-width:0;}
  .subtask-text{font-size:0.8rem;font-weight:400;color:var(--tx);line-height:1.3;}
  .subtask-item.wip .subtask-text{color:var(--blue);font-weight:500;}
  .subtask-item.done .subtask-text{text-decoration:line-through;color:var(--tx3);}
  .subtask-meta{display:flex;gap:5px;align-items:center;margin-top:3px;flex-wrap:wrap;}
  .wip-badge{font-size:0.58rem;font-weight:700;color:var(--blue);background:var(--blues);padding:1px 6px;border-radius:99px;}
  .subtask-deadline{font-size:0.6rem;font-weight:600;padding:1px 6px;border-radius:99px;}
  .sdl-ok{background:var(--blues);color:var(--blue);}
  .sdl-soon{background:var(--oranges);color:var(--orange);}
  .sdl-today{background:var(--reds);color:var(--red);}
  .sdl-late{background:var(--reds);color:var(--red);}
  .subtask-del{width:18px;height:18px;border-radius:50%;border:none;background:transparent;color:var(--tx3);font-size:0.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all 0.15s;flex-shrink:0;}
  .subtask-item:hover .subtask-del{opacity:1;}
  .subtask-del:hover{background:var(--reds);color:var(--red);}

  /* CHILDREN subtasks indented */
  .subtask-children{margin-left:22px;border-left:2px solid var(--brdl);padding-left:8px;margin-top:2px;}
  .subtask-add-child{font-size:0.65rem;color:var(--blue);cursor:pointer;padding:2px 4px;border-radius:4px;border:none;background:transparent;font-family:inherit;opacity:0;transition:opacity 0.15s;}
  .subtask-item:hover .subtask-add-child{opacity:1;}

  /* EMPTY */
  .empty-projects{text-align:center;padding:60px 20px;color:var(--tx3);}
  .empty-icon{font-size:2.5rem;margin-bottom:12px;}
  .empty-projects p{font-size:0.88rem;line-height:1.6;}

  /* EDIT MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.25);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;}
  .modal-overlay.active{display:flex;}
  .modal-box{background:var(--surf);border-radius:var(--r);padding:20px;width:340px;max-width:90vw;box-shadow:var(--sh2);}
  .modal-title{font-size:0.88rem;font-weight:700;margin-bottom:14px;}
  .modal-field{margin-bottom:10px;}
  .modal-lbl{font-size:0.6rem;font-weight:600;color:var(--tx3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:3px;}
  .modal-input{width:100%;background:var(--surf2);border:1.5px solid var(--brd);border-radius:6px;color:var(--tx);font-family:inherit;font-size:0.82rem;padding:7px 10px;outline:none;transition:border-color 0.2s;}
  .modal-input:focus{border-color:var(--blue);}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-save{flex:1;background:var(--blue);color:#fff;border:none;padding:8px;border-radius:8px;font-family:inherit;font-weight:600;font-size:0.82rem;cursor:pointer;}
  .modal-cancel{background:var(--surf2);color:var(--tx2);border:1.5px solid var(--brd);padding:8px 16px;border-radius:8px;font-family:inherit;font-weight:600;font-size:0.82rem;cursor:pointer;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(28,28,30,0.88);color:#fff;backdrop-filter:blur(20px);padding:8px 16px;border-radius:99px;font-size:0.78rem;font-weight:500;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);z-index:300;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);}

  @media(max-width:768px){
    .main{padding:14px 12px;}
    .add-project-row{flex-direction:column;}
    .add-input{min-width:unset;}
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="daily-planner.html" class="logo">Daily<span> Planner</span></a>
  <div class="nav-links">
    <a href="daily-planner.html" class="nav-link">📅 Planner</a>
    <a href="projects.html" class="nav-link active">📁 Progetti</a>
  </div>
</div>

<div class="loading-screen" id="loadScreen">
  <div class="load-spin"></div>
  <div style="font-size:0.78rem;color:var(--tx3)">Caricamento...</div>
</div>

<div class="main" id="mainContent" style="display:none">
  <div class="add-project-bar">
    <div class="add-project-title">Nuovo progetto</div>
    <div class="add-project-row">
      <input type="text" class="add-input" id="projName" placeholder="Nome progetto..." onkeydown="if(event.key==='Enter')addProject()">
      <div class="add-date-col">
        <div class="add-date-lbl">Scadenza (opz.)</div>
        <input type="date" class="add-date" id="projDeadline">
      </div>
      <button class="add-btn" onclick="addProject()">+ Aggiungi</button>
    </div>
  </div>

  <div class="projects-list" id="projectsList"></div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Modifica progetto</div>
    <div class="modal-field">
      <div class="modal-lbl">Nome</div>
      <input type="text" class="modal-input" id="modalName">
    </div>
    <div class="modal-field" id="modalDeadlineField">
      <div class="modal-lbl">Scadenza (opz.)</div>
      <input type="date" class="modal-input" id="modalDeadline">
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Annulla</button>
      <button class="modal-save" onclick="saveModal()">Salva</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUS8U-g_a7SfDLpi_4QyPCtrJccMWlXmE",
  authDomain: "daily-planner-1764d.firebaseapp.com",
  projectId: "daily-planner-1764d",
  storageBucket: "daily-planner-1764d.firebasestorage.app",
  messagingSenderId: "60168883195",
  appId: "1:60168883195:web:da318bcb8d03b4a5b8195e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DOC_ID = "simone_projects";

let projects = [];
let dragSrc = null;
let modalMode = null, modalId = null;

// ── INIT ──
async function init() {
  onSnapshot(doc(db, "dailyplanner", DOC_ID), snap => {
    if (snap.exists()) {
      projects = snap.data().projects || [];
    } else {
      projects = [];
    }
    document.getElementById('loadScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    renderProjects();
  }, err => {
    console.error(err);
    document.getElementById('loadScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
  });
}

async function save() {
  await setDoc(doc(db, "dailyplanner", DOC_ID), { projects });
}

// ── UTILS ──
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function todayISO() { return new Date().toISOString().split('T')[0]; }
function offISO(n) { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

function deadlineChip(dl) {
  if (!dl) return '';
  const td=todayISO(), tm=offISO(1), d3=offISO(3);
  let cls, label;
  if (dl < td) { cls='scad-late'; label='⚠ Scaduto'; }
  else if (dl === td) { cls='scad-today'; label='📌 Oggi'; }
  else if (dl <= d3) { cls='scad-soon'; label='⏰ ' + new Date(dl+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'}); }
  else { cls='scad-ok'; label='📅 ' + new Date(dl+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'}); }
  return `<span class="project-deadline ${cls}">${label}</span>`;
}

function countTasks(tasks) {
  if (!tasks || !tasks.length) return {total:0, done:0, wip:0};
  let total = 0, done = 0, wip = 0;
  function walk(list) {
    for (const t of list) {
      total++;
      if (t.done) done++;
      else if (t.wip) wip++;
      if (t.children && t.children.length) walk(t.children);
    }
  }
  walk(tasks);
  return {total, done, wip};
}

// ── PROJECTS ──
window.addProject = async function() {
  const name = document.getElementById('projName').value.trim();
  if (!name) { showToast('Scrivi il nome del progetto'); return; }
  const dl = document.getElementById('projDeadline').value;
  projects.unshift({ id: uid(), name, deadline: dl||null, done: false, expanded: true, tasks: [] });
  await save();
  document.getElementById('projName').value = '';
  document.getElementById('projDeadline').value = '';
  showToast('✓ Progetto aggiunto');
}

window.toggleProject = async function(id) {
  const p = projects.find(p=>p.id===id);
  if (p) { p.done = !p.done; await save(); }
}

window.toggleExpand = async function(id) {
  const p = projects.find(p=>p.id===id);
  if (p) { p.expanded = !p.expanded; await save(); }
}

window.deleteProject = async function(id) {
  if (!confirm('Eliminare questo progetto e tutte le sue attività?')) return;
  projects = projects.filter(p=>p.id!==id);
  await save();
  showToast('Progetto eliminato');
}

// ── MODAL ──
window.openEditProject = function(id) {
  const p = projects.find(p=>p.id===id);
  if (!p) return;
  modalMode = 'project'; modalId = id;
  document.getElementById('modalTitle').textContent = 'Modifica progetto';
  document.getElementById('modalName').value = p.name;
  document.getElementById('modalDeadline').value = p.deadline||'';
  document.getElementById('modalDeadlineField').style.display = '';
  document.getElementById('editModal').classList.add('active');
}

window.closeModal = function() { document.getElementById('editModal').classList.remove('active'); modalMode=null; modalId=null; }

window.saveModal = async function() {
  const name = document.getElementById('modalName').value.trim();
  if (!name) return;
  if (modalMode === 'project') {
    const p = projects.find(p=>p.id===modalId);
    if (p) { p.name=name; p.deadline=document.getElementById('modalDeadline').value||null; }
  }
  await save();
  closeModal();
  showToast('✓ Salvato');
}

// ── SUBTASKS ──
function findTask(tasks, id) {
  for (const t of tasks) {
    if (t.id === id) return t;
    if (t.children) { const f = findTask(t.children, id); if (f) return f; }
  }
  return null;
}

function removeTask(tasks, id) {
  for (let i=0; i<tasks.length; i++) {
    if (tasks[i].id === id) { tasks.splice(i,1); return true; }
    if (tasks[i].children && removeTask(tasks[i].children, id)) return true;
  }
  return false;
}

window.addSubtask = async function(projId, parentId) {
  const inputId = parentId ? 'sub_'+parentId : 'subtask_'+projId;
  const dateId = parentId ? 'subdate_'+parentId : 'subtaskdate_'+projId;
  const input = document.getElementById(inputId);
  const dateInput = document.getElementById(dateId);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const p = projects.find(p=>p.id===projId);
  if (!p) return;
  const newTask = { id: uid(), text, done: false, wip: false, deadline: dateInput?.value||null, children: [] };
  if (parentId) {
    const parent = findTask(p.tasks, parentId);
    if (parent) { if (!parent.children) parent.children=[]; parent.children.push(newTask); }
  } else {
    p.tasks.push(newTask);
  }
  input.value = '';
  if (dateInput) dateInput.value = '';
  await save();
}

window.toggleSubtask = async function(projId, taskId) {
  const p = projects.find(p=>p.id===projId);
  if (!p) return;
  const t = findTask(p.tasks, taskId);
  if (!t) return;
  // Cycle: none → wip → done → none
  if (!t.wip && !t.done) { t.wip = true; }
  else if (t.wip && !t.done) { t.wip = false; t.done = true; }
  else { t.done = false; t.wip = false; }
  await save();
}

window.deleteSubtask = async function(projId, taskId) {
  const p = projects.find(p=>p.id===projId);
  if (!p) return;
  removeTask(p.tasks, taskId);
  await save();
  showToast('Attività eliminata');
}

// ── RENDER ──
function subtaskDeadlineChip(dl) {
  if (!dl) return '';
  const td=todayISO(), tm=offISO(1), d3=offISO(3);
  let cls, label;
  if (dl < td) { cls='sdl-late'; label='⚠ ' + new Date(dl+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'}); }
  else if (dl === td) { cls='sdl-today'; label='📌 Oggi'; }
  else if (dl <= d3) { cls='sdl-soon'; label='⏰ ' + new Date(dl+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'}); }
  else { cls='sdl-ok'; label='📅 ' + new Date(dl+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'}); }
  return `<span class="subtask-deadline ${cls}">${label}</span>`;
}

function renderSubtasks(projId, tasks, depth) {
  if (!tasks || !tasks.length) return '';
  return tasks.map(t => {
    const stateClass = t.done ? 'done' : t.wip ? 'wip' : '';
    const chkContent = t.done ? '✓' : t.wip ? '···' : '';
    const childrenHtml = t.children && t.children.length ?
      `<div class="subtask-children">${renderSubtasks(projId, t.children, depth+1)}</div>` : '';
    const addChildInput = depth < 3 ? `
      <div class="subtask-children" id="child_wrap_${t.id}" style="display:none">
        <div class="subtask-add-row" style="margin-bottom:4px;">
          <input type="text" class="subtask-input" id="sub_${t.id}" placeholder="Sotto-attività..." onkeydown="if(event.key==='Enter')addSubtask('${projId}','${t.id}')">
          <input type="date" class="subtask-input" id="subdate_${t.id}" style="width:120px;flex:none;font-size:0.7rem;">
          <button class="subtask-add-btn" onclick="addSubtask('${projId}','${t.id}')">+</button>
        </div>
      </div>` : '';
    const addChildBtn = depth < 3 ? `<button class="subtask-add-child" onclick="toggleChildInput('${t.id}')">+ sub</button>` : '';
    const dlChip = subtaskDeadlineChip(t.deadline);
    const wipBadge = t.wip ? '<span class="wip-badge">⚙ In corso</span>' : '';
    return `<div class="subtask-item ${stateClass}">
      <div class="subtask-chk" onclick="toggleSubtask('${projId}','${t.id}')">${chkContent}</div>
      <div class="subtask-body">
        <div class="subtask-text">${esc(t.text)}</div>
        <div class="subtask-meta">${wipBadge}${dlChip}</div>
        ${childrenHtml}
        ${addChildInput}
      </div>
      ${addChildBtn}
      <button class="subtask-del" onclick="deleteSubtask('${projId}','${t.id}')">×</button>
    </div>`;
  }).join('');
}

window.toggleChildInput = function(taskId) {
  const wrap = document.getElementById('child_wrap_'+taskId);
  if (wrap) { wrap.style.display = wrap.style.display==='none'?'block':'none'; }
}

function renderProjects() {
  const list = document.getElementById('projectsList');
  if (!projects.length) {
    list.innerHTML = `<div class="empty-projects"><div class="empty-icon">📁</div><p>Nessun progetto ancora.<br>Aggiungine uno qui sopra!</p></div>`;
    return;
  }
  list.innerHTML = projects.map(p => {
    const {total, done, wip} = countTasks(p.tasks);
    const pct = total ? Math.round(done/total*100) : 0;
    const pctWip = total ? Math.round(wip/total*100) : 0;
    const progressHtml = total > 0 ? `
      <div class="progress-wrap">
        <div class="progress-bar" style="position:relative;overflow:hidden;">
          <div class="progress-fill" style="width:${pct}%;position:absolute;left:0;top:0;bottom:0;background:var(--green);"></div>
          <div style="width:${pctWip}%;position:absolute;left:${pct}%;top:0;bottom:0;background:var(--orange);border-radius:0 2px 2px 0;"></div>
        </div>
        <span class="progress-text">${done}/${total}${wip?' ('+wip+' in corso)':''}</span>
      </div>` : '';
    const subtasksHtml = p.expanded ? `
      <div class="subtasks-area">
        <div class="subtask-add-row">
          <input type="text" class="subtask-input" id="subtask_${p.id}" placeholder="Aggiungi attività..." onkeydown="if(event.key==='Enter')addSubtask('${p.id}',null)">
          <input type="date" class="subtask-input" id="subtaskdate_${p.id}" style="width:130px;flex:none;font-size:0.72rem;">
          <button class="subtask-add-btn" onclick="addSubtask('${p.id}',null)">+</button>
        </div>
        ${renderSubtasks(p.id, p.tasks, 0)}
        ${!p.tasks||!p.tasks.length ? '<div style="text-align:center;padding:12px;color:var(--tx3);font-size:0.78rem;">Nessuna attività — aggiungine una sopra</div>' : ''}
      </div>` : '';
    return `<div class="project-card ${p.done?'completed':''} ${p.expanded?'expanded':''}" id="proj_${p.id}" draggable="true" ondragstart="dragStart(event,'${p.id}')" ondragover="dragOver(event,'${p.id}')" ondrop="dragDrop(event,'${p.id}')" ondragleave="dragLeave(event,'${p.id}')">
      <div class="project-header" onclick="toggleExpand('${p.id}')">
        <span class="drag-handle" onclick="event.stopPropagation()">⠿</span>
        <div class="project-toggle" onclick="event.stopPropagation();toggleProject('${p.id}')">${p.done?'✓':''}</div>
        <div class="project-info">
          <div class="project-name">${esc(p.name)}</div>
          <div class="project-meta">
            ${deadlineChip(p.deadline)}
            ${progressHtml}
          </div>
        </div>
        <div class="project-actions" onclick="event.stopPropagation()">
          <button class="proj-btn edit-proj" onclick="openEditProject('${p.id}')" title="Modifica">✏️</button>
          <button class="proj-btn" onclick="deleteProject('${p.id}')" title="Elimina">×</button>
        </div>
        <button class="expand-btn">›</button>
      </div>
      ${subtasksHtml}
    </div>`;
  }).join('');
}

// ── DRAG & DROP ──
window.dragStart = function(e, id) {
  dragSrc = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(()=>document.getElementById('proj_'+id)?.classList.add('dragging'),0);
}
window.dragOver = function(e, id) {
  e.preventDefault();
  if (id !== dragSrc) document.getElementById('proj_'+id)?.classList.add('drag-over');
}
window.dragLeave = function(e, id) {
  document.getElementById('proj_'+id)?.classList.remove('drag-over');
}
window.dragDrop = async function(e, id) {
  e.preventDefault();
  document.querySelectorAll('.project-card').forEach(c=>c.classList.remove('dragging','drag-over'));
  if (dragSrc === id) return;
  const srcIdx = projects.findIndex(p=>p.id===dragSrc);
  const dstIdx = projects.findIndex(p=>p.id===id);
  if (srcIdx<0||dstIdx<0) return;
  const [moved] = projects.splice(srcIdx,1);
  projects.splice(dstIdx,0,moved);
  await save();
  dragSrc = null;
}

init();
</script>
</body>
</html>
